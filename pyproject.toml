[project]
name = "zenodo-harvest"
version = "0.1.0"
description = "Harvest and triage DFT (VASP) datasets from Zenodo for MLIP training."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
# fetch/parse/store; pymatgen 2026.5.4 is the latest PyPI release (core 2026.5.18)
parse = ["pymatgen>=2026.5.4", "ase>=3.25", "tqdm>=4.66"]
parquet = ["pyarrow>=15"]
dev = ["ruff", "mypy", "pytest", "types-requests"]

[project.scripts]
zenodo-harvest = "zenodo_harvest.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zenodo_harvest"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
